<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Match-3 Prototype — Salle de Sport</title>
<style>
  :root {
    --bg-top: #171a24;
    --bg-bottom: #1f2433;
    --panel: #242938;
    --panel-light: #2d3346;
    --accent: #4fd1c5;
    --accent-warn: #f6ad55;
    --accent-bad: #fc8181;
    --text: #eef1f7;
    --text-dim: #a7adbd;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
  }
  h1 {
    font-size: 1rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: .3px;
    color: var(--text-dim);
  }
  #hud {
    width: min(94vw, 520px);
    display: flex;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel);
    padding: 10px 16px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: .72rem;
    color: var(--text-dim);
    min-width: 70px;
  }
  .hud-item .value {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
  }
  #moves-left.low { color: var(--accent-bad); }
  #board-wrap {
    position: relative;
    width: min(94vw, 520px);
    aspect-ratio: 1 / 1;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 16px;
    background: var(--panel);
    box-shadow: 0 10px 34px rgba(0,0,0,.45);
    touch-action: none;
    cursor: pointer;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(10, 12, 18, .88);
    border-radius: 16px;
    text-align: center;
    padding: 24px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 1.7rem; }
  #overlay p { margin: 0; color: var(--text-dim); font-size: .9rem; }
  button#restart-btn {
    background: var(--accent);
    border: none;
    color: #0b1015;
    font-weight: 700;
    padding: 10px 26px;
    border-radius: 999px;
    font-size: .95rem;
    cursor: pointer;
    margin-top: 6px;
  }
  button#restart-btn:hover { filter: brightness(1.08); }
  #footer { font-size: .68rem; color: var(--text-dim); opacity: .6; text-align: center; }
</style>
</head>
<body>
  <h1>Match-3 Prototype — Moteur de puzzle</h1>

  <div id="hud">
    <div class="hud-item">
      Mouvements
      <span class="value" id="moves-left">20</span>
    </div>
    <div class="hud-item">
      Score
      <span class="value" id="score">0</span>
    </div>
    <div class="hud-item">
      Objectif
      <span class="value" id="objective">0 / 15 🏋️</span>
    </div>
  </div>

  <div id="board-wrap">
    <canvas id="board" width="640" height="640"></canvas>
    <div id="overlay">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <button id="restart-btn">Rejouer</button>
    </div>
  </div>

  <div id="footer">Prototype isolé du moteur Match-3 — pas d'habillage rénovation/salle/clients à ce stade.</div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------
  // Config
  // ---------------------------------------------------------------------
  const GRID_SIZE = 8;               // ajustable
  const SYMBOLS = ["🏋️", "🥤", "👟", "🧤", "🪢", "🎽"]; // haltère, gourde, chaussure, gant, corde à sauter, débardeur
  const MAX_MOVES = 20;
  const TARGET_SYMBOL_INDEX = 0;     // 🏋️ haltère
  const TARGET_COUNT = 15;
  const POINTS_PER_TILE = 10;

  const BOARD_PX = 640;              // taille logique du board (indépendante du DPR)
  const CELL = BOARD_PX / GRID_SIZE;

  const SWAP_MS = 160;
  const REMOVE_MS = 200;
  const FALL_MS = 240;
  const LERP = 0.28;
  const SWIPE_THRESHOLD = 18; // px (coords écran)

  // ---------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const movesEl = document.getElementById("moves-left");
  const scoreEl = document.getElementById("score");
  const objectiveEl = document.getElementById("objective");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayText = document.getElementById("overlay-text");
  const restartBtn = document.getElementById("restart-btn");

  function setupCanvasResolution() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = BOARD_PX * dpr;
    canvas.height = BOARD_PX * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  setupCanvasResolution();
  window.addEventListener("resize", setupCanvasResolution);

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  let tileId = 0;
  let tiles = [];                 // tuiles vivantes (pour le rendu)
  let grid = [];                  // grid[row][col] -> tuile | null
  let selected = null;            // {row, col}
  let inputLocked = false;
  let gameOver = false;
  let movesLeft = MAX_MOVES;
  let score = 0;
  let collected = 0;

  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const randSymbol = () => Math.floor(Math.random() * SYMBOLS.length);
  const inBounds = (r, c) => r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE;
  const areAdjacent = (a, b) => Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;

  function createTile(row, col, symbolIndex, spawnRow) {
    return {
      id: tileId++,
      symbolIndex,
      row, col,
      x: col * CELL,
      y: (spawnRow !== undefined ? spawnRow : row) * CELL,
      removing: false,
      alpha: 1,
    };
  }

  // ---------------------------------------------------------------------
  // Génération de grille / détection de matches
  // ---------------------------------------------------------------------
  function buildEmptyGrid() {
    return Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));
  }

  function symbolAt(r, c) {
    const t = grid[r] && grid[r][c];
    return t ? t.symbolIndex : -1;
  }

  // Génère une grille sans alignement de 3+ déjà formé.
  function initGrid() {
    grid = buildEmptyGrid();
    tiles = [];
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        const avoid = new Set();
        if (col >= 2 && symbolAt(row, col - 1) === symbolAt(row, col - 2)) {
          avoid.add(symbolAt(row, col - 1));
        }
        if (row >= 2 && symbolAt(row - 1, col) === symbolAt(row - 2, col)) {
          avoid.add(symbolAt(row - 1, col));
        }
        let sym;
        do { sym = randSymbol(); } while (avoid.has(sym));
        const tile = createTile(row, col, sym);
        grid[row][col] = tile;
        tiles.push(tile);
      }
    }
    ensureSolvable();
  }

  // Retourne la liste des cases (row,col) faisant partie d'un alignement >= 3.
  function findMatches() {
    const matched = new Set(); // clé "row,col"

    // Lignes
    for (let row = 0; row < GRID_SIZE; row++) {
      let runStart = 0;
      for (let col = 1; col <= GRID_SIZE; col++) {
        const prevSym = symbolAt(row, col - 1);
        const curSym = col < GRID_SIZE ? symbolAt(row, col) : -2;
        if (curSym !== prevSym) {
          const runLen = col - runStart;
          if (runLen >= 3 && prevSym !== -1) {
            for (let k = runStart; k < col; k++) matched.add(row + "," + k);
          }
          runStart = col;
        }
      }
    }

    // Colonnes
    for (let col = 0; col < GRID_SIZE; col++) {
      let runStart = 0;
      for (let row = 1; row <= GRID_SIZE; row++) {
        const prevSym = symbolAt(row - 1, col);
        const curSym = row < GRID_SIZE ? symbolAt(row, col) : -2;
        if (curSym !== prevSym) {
          const runLen = row - runStart;
          if (runLen >= 3 && prevSym !== -1) {
            for (let k = runStart; k < row; k++) matched.add(k + "," + col);
          }
          runStart = row;
        }
      }
    }

    return matched;
  }

  function swapGridCells(a, b) {
    const ta = grid[a.row][a.col];
    const tb = grid[b.row][b.col];
    grid[a.row][a.col] = tb;
    grid[b.row][b.col] = ta;
    if (ta) { ta.row = b.row; ta.col = b.col; }
    if (tb) { tb.row = a.row; tb.col = a.col; }
  }

  // Vérifie s'il existe au moins un swap possible qui crée un alignement.
  function hasAnyMove() {
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        if (col < GRID_SIZE - 1 && trySwapCreatesMatch(row, col, row, col + 1)) return true;
        if (row < GRID_SIZE - 1 && trySwapCreatesMatch(row, col, row + 1, col)) return true;
      }
    }
    return false;
  }

  function trySwapCreatesMatch(r1, c1, r2, c2) {
    const a = { row: r1, col: c1 }, b = { row: r2, col: c2 };
    swapGridCells(a, b);
    const matched = findMatches().size > 0;
    swapGridCells(a, b);
    return matched;
  }

  // Si le plateau est bloqué (aucun coup possible) ou a un match résiduel, on rebrasse.
  function ensureSolvable() {
    let attempts = 0;
    while ((findMatches().size > 0 || !hasAnyMove()) && attempts < 200) {
      for (let row = 0; row < GRID_SIZE; row++) {
        for (let col = 0; col < GRID_SIZE; col++) {
          grid[row][col].symbolIndex = randSymbol();
        }
      }
      attempts++;
    }
  }

  // ---------------------------------------------------------------------
  // Gravité / refill
  // ---------------------------------------------------------------------
  function applyGravity() {
    for (let col = 0; col < GRID_SIZE; col++) {
      const existing = [];
      for (let row = 0; row < GRID_SIZE; row++) {
        if (grid[row][col]) existing.push(grid[row][col]);
        grid[row][col] = null;
      }
      let writeRow = GRID_SIZE - 1;
      for (let i = existing.length - 1; i >= 0; i--) {
        const t = existing[i];
        t.row = writeRow;
        t.col = col;
        grid[writeRow][col] = t;
        writeRow--;
      }
      let spawnOffset = 1;
      for (let row = writeRow; row >= 0; row--) {
        const t = createTile(row, col, randSymbol(), -spawnOffset);
        grid[row][col] = t;
        tiles.push(t);
        spawnOffset++;
      }
    }
  }

  // ---------------------------------------------------------------------
  // Boucle de résolution (match -> suppression -> gravité -> cascade)
  // ---------------------------------------------------------------------
  async function resolveCascade() {
    let matched = findMatches();
    while (matched.size > 0) {
      for (const key of matched) {
        const [r, c] = key.split(",").map(Number);
        const t = grid[r][c];
        if (!t) continue;
        t.removing = true;
        score += POINTS_PER_TILE;
        if (t.symbolIndex === TARGET_SYMBOL_INDEX) collected++;
      }
      updateHud();
      await wait(REMOVE_MS);

      for (const key of matched) {
        const [r, c] = key.split(",").map(Number);
        const t = grid[r][c];
        if (t) {
          tiles = tiles.filter((tile) => tile.id !== t.id);
          grid[r][c] = null;
        }
      }

      applyGravity();
      await wait(FALL_MS);

      matched = findMatches();
    }

    if (!gameOver && !hasAnyMove()) {
      reshuffleBoard();
      await wait(FALL_MS);
    }
  }

  function reshuffleBoard() {
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        grid[row][col].symbolIndex = randSymbol();
      }
    }
    ensureSolvable();
  }

  // ---------------------------------------------------------------------
  // Interaction joueur
  // ---------------------------------------------------------------------
  async function attemptSwap(a, b) {
    if (inputLocked || gameOver) return;
    if (!areAdjacent(a, b)) {
      selected = b;
      return;
    }

    inputLocked = true;
    selected = null;
    swapGridCells(a, b);
    await wait(SWAP_MS);

    const matched = findMatches();
    if (matched.size === 0) {
      swapGridCells(a, b); // annule l'échange
      await wait(SWAP_MS);
      inputLocked = false;
      return;
    }

    movesLeft--;
    updateHud();
    await resolveCascade();

    inputLocked = false;
    checkEndConditions();
  }

  function checkEndConditions() {
    if (gameOver) return;
    if (collected >= TARGET_COUNT) {
      gameOver = true;
      showOverlay("Victoire !", `Objectif atteint : ${TARGET_COUNT} ${SYMBOLS[TARGET_SYMBOL_INDEX]} collectés en ${MAX_MOVES - movesLeft} mouvements. Score : ${score}.`);
    } else if (movesLeft <= 0) {
      gameOver = true;
      showOverlay("Défaite", `Mouvements épuisés. ${collected}/${TARGET_COUNT} ${SYMBOLS[TARGET_SYMBOL_INDEX]} collectés. Score : ${score}.`);
    }
  }

  function showOverlay(title, text) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlay.classList.add("show");
  }

  function updateHud() {
    movesEl.textContent = movesLeft;
    movesEl.classList.toggle("low", movesLeft <= 5);
    scoreEl.textContent = score;
    objectiveEl.textContent = `${Math.min(collected, TARGET_COUNT)} / ${TARGET_COUNT} ${SYMBOLS[TARGET_SYMBOL_INDEX]}`;
  }

  function resetGame() {
    tileId = 0;
    movesLeft = MAX_MOVES;
    score = 0;
    collected = 0;
    gameOver = false;
    selected = null;
    inputLocked = false;
    overlay.classList.remove("show");
    initGrid();
    updateHud();
  }

  // ---------------------------------------------------------------------
  // Rendu
  // ---------------------------------------------------------------------
  function updatePositions() {
    for (const t of tiles) {
      const targetX = t.col * CELL;
      const targetY = t.row * CELL;
      t.x += (targetX - t.x) * LERP;
      t.y += (targetY - t.y) * LERP;
      if (Math.abs(targetX - t.x) < 0.5) t.x = targetX;
      if (Math.abs(targetY - t.y) < 0.5) t.y = targetY;
      if (t.removing) {
        t.alpha = Math.max(0, t.alpha - 1 / (REMOVE_MS / 16));
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);

    // damier de fond (couleurs pleines : les remplissages semi-transparents
    // désaturent les glyphes emoji couleur sur certains moteurs de rendu logiciel)
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        ctx.fillStyle = (row + col) % 2 === 0 ? "#2a3042" : "#262b3c";
        roundRect(ctx, col * CELL + 2, row * CELL + 2, CELL - 4, CELL - 4, 10);
        ctx.fill();
      }
    }

    // sélection
    if (selected) {
      ctx.strokeStyle = "#4fd1c5";
      ctx.lineWidth = 3;
      roundRect(ctx, selected.col * CELL + 3, selected.row * CELL + 3, CELL - 6, CELL - 6, 10);
      ctx.stroke();
    }

    // tuiles
    const fontSize = CELL * 0.56;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `${fontSize}px sans-serif`;
    for (const t of tiles) {
      if (t.removing && t.alpha <= 0) continue;
      ctx.save();
      ctx.globalAlpha = t.alpha;
      const cx = t.x + CELL / 2;
      const cy = t.y + CELL / 2;
      const scale = t.removing ? 0.7 + 0.3 * t.alpha : 1;
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.fillText(SYMBOLS[t.symbolIndex], 0, 1);
      ctx.restore();
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function loop() {
    updatePositions();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------------------------------------------------------------------
  // Entrées (clic + swipe)
  // ---------------------------------------------------------------------
  function pixelToCell(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (BOARD_PX / rect.width);
    const y = (clientY - rect.top) * (BOARD_PX / rect.height);
    return {
      row: Math.min(GRID_SIZE - 1, Math.max(0, Math.floor(y / CELL))),
      col: Math.min(GRID_SIZE - 1, Math.max(0, Math.floor(x / CELL))),
    };
  }

  let pointerDown = null; // {clientX, clientY, cell}
  let dragHandled = false;

  canvas.addEventListener("pointerdown", (e) => {
    if (inputLocked || gameOver) return;
    canvas.setPointerCapture(e.pointerId);
    const cell = pixelToCell(e.clientX, e.clientY);
    pointerDown = { clientX: e.clientX, clientY: e.clientY, cell };
    dragHandled = false;
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!pointerDown || dragHandled || inputLocked || gameOver) return;
    const dx = e.clientX - pointerDown.clientX;
    const dy = e.clientY - pointerDown.clientY;
    if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;

    dragHandled = true;
    let target = { ...pointerDown.cell };
    if (Math.abs(dx) > Math.abs(dy)) {
      target.col += dx > 0 ? 1 : -1;
    } else {
      target.row += dy > 0 ? 1 : -1;
    }
    if (inBounds(target.row, target.col)) {
      attemptSwap(pointerDown.cell, target);
    }
  });

  canvas.addEventListener("pointerup", (e) => {
    if (!pointerDown) return;
    if (!dragHandled && !inputLocked && !gameOver) {
      const cell = pointerDown.cell;
      if (!selected) {
        selected = cell;
      } else if (selected.row === cell.row && selected.col === cell.col) {
        selected = null;
      } else if (areAdjacent(selected, cell)) {
        const from = selected;
        attemptSwap(from, cell);
      } else {
        selected = cell;
      }
    }
    pointerDown = null;
  });

  canvas.addEventListener("pointercancel", () => { pointerDown = null; });

  restartBtn.addEventListener("click", resetGame);

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------
  resetGame();
  loop();
})();
</script>
</body>
</html>
