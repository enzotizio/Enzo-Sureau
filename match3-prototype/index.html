<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Match-3 Prototype — Salle de Sport</title>
<style>
  :root {
    --bg-top: #171a24;
    --bg-bottom: #1f2433;
    --panel: #242938;
    --panel-light: #2d3346;
    --accent: #4fd1c5;
    --accent-warn: #f6ad55;
    --accent-bad: #fc8181;
    --text: #eef1f7;
    --text-dim: #a7adbd;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
  }
  h1 {
    font-size: 1rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: .3px;
    color: var(--text-dim);
  }
  #hud {
    width: min(94vw, 520px);
    display: flex;
    justify-content: space-between;
    gap: 8px;
    background: var(--panel);
    padding: 10px 16px;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
  }
  .hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: .72rem;
    color: var(--text-dim);
    min-width: 70px;
  }
  .hud-item .value {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--text);
  }
  #moves-left.low { color: var(--accent-bad); }
  #board-wrap {
    position: relative;
    width: min(94vw, 520px);
    aspect-ratio: 1 / 1;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 16px;
    background: var(--panel);
    box-shadow: 0 10px 34px rgba(0,0,0,.45);
    touch-action: none;
    cursor: pointer;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(10, 12, 18, .88);
    border-radius: 16px;
    text-align: center;
    padding: 24px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 1.7rem; }
  #overlay p { margin: 0; color: var(--text-dim); font-size: .9rem; }
  button#restart-btn {
    background: var(--accent);
    border: none;
    color: #0b1015;
    font-weight: 700;
    padding: 10px 26px;
    border-radius: 999px;
    font-size: .95rem;
    cursor: pointer;
    margin-top: 6px;
  }
  button#restart-btn:hover { filter: brightness(1.08); }
  #footer { font-size: .68rem; color: var(--text-dim); opacity: .6; text-align: center; }

  .overlay-actions { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  button.secondary {
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: .9rem;
    cursor: pointer;
  }
  button.secondary:hover { background: rgba(79, 209, 197, .12); }

  /* Écrans (salle / puzzle) */
  .screen { display: none; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 520px; }
  .screen.active { display: flex; }

  #room-money {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    padding: 8px 18px;
    border-radius: 999px;
    box-shadow: 0 4px 18px rgba(0,0,0,.35);
    font-weight: 700;
    font-size: 1.1rem;
  }
  .play-panel {
    width: 100%;
    background: var(--panel);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 10px 34px rgba(0,0,0,.45);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .room-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* Vue isométrique multi-zones */
  .zones-strip {
    width: 100%;
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding: 10px 4px 18px;
    scroll-snap-type: x proximity;
  }
  .iso-zone {
    position: relative;
    flex: 0 0 auto;
    width: 148px;
    scroll-snap-align: start;
    cursor: pointer;
  }
  .iso-zone:active { transform: scale(.97); }
  .iso-shape {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1.05;
    clip-path: polygon(28% 0%, 100% 12%, 72% 100%, 0% 88%);
    background: linear-gradient(160deg, #4a4238, #302a24);
    overflow: hidden;
    transition: background 500ms ease, filter 400ms ease;
    box-shadow: 0 8px 20px rgba(0,0,0,.35);
  }
  .iso-zone[data-state="renove"] .iso-shape { background: linear-gradient(160deg, #2d3f4a, #1c2a33); }
  .iso-zone[data-state="locked"] .iso-shape { background: linear-gradient(160deg, #2a2d36, #1a1c22); filter: grayscale(.7) brightness(.65); }
  .iso-icon {
    position: absolute;
    top: 48%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2.1rem;
    opacity: .9;
  }
  .iso-zone[data-state="locked"] .iso-icon { opacity: .25; filter: grayscale(1); }
  .iso-lock {
    position: absolute;
    top: 12px;
    right: 18px;
    font-size: 1.15rem;
  }
  .iso-info { margin-top: 8px; text-align: center; }
  .iso-zone-name { font-size: .8rem; font-weight: 700; }
  .iso-zone-status { font-size: .7rem; color: var(--text-dim); margin-top: 2px; }
  .iso-zone[data-state="locked"] .iso-zone-status { color: var(--accent-warn); font-weight: 600; }
  .iso-zone.shake { animation: iso-shake 400ms ease; }
  @keyframes iso-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .iso-zone.unlocking .iso-shape { animation: iso-unlock 650ms ease; }
  @keyframes iso-unlock {
    0% { filter: grayscale(.7) brightness(.65); }
    45% { filter: grayscale(0) brightness(1.5); }
    100% { filter: grayscale(0) brightness(1); }
  }
  button#play-level-btn {
    background: var(--accent);
    border: none;
    color: #0b1015;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: .95rem;
    cursor: pointer;
  }
  button#play-level-btn:hover { filter: brightness(1.08); }
  button#play-level-btn:disabled {
    background: var(--panel-light);
    color: var(--text-dim);
    cursor: not-allowed;
    filter: none;
  }

  #lives-bar { display: flex; align-items: center; gap: 6px; }
  #lives-bar .heart { font-size: 1.3rem; line-height: 1; filter: grayscale(0); }
  #lives-bar .heart[data-filled="false"] { filter: grayscale(1); opacity: .35; }
  #lives-countdown {
    font-size: .8rem;
    color: var(--text-dim);
    min-height: 1.1em;
  }
  #no-lives-message {
    display: none;
    font-size: .82rem;
    color: var(--accent-bad);
    text-align: center;
    max-width: 90%;
    margin: 0;
  }
  #no-lives-message.show { display: block; }
</style>
</head>
<body>
  <div id="room-screen" class="screen active">
    <h1>Ma Salle</h1>
    <div id="room-money">
      <span>💰</span>
      <span id="money-amount-room">0</span>
    </div>
    <div id="lives-bar">
      <span class="heart" data-filled="true">❤️</span>
      <span class="heart" data-filled="true">❤️</span>
      <span class="heart" data-filled="true">❤️</span>
      <span class="heart" data-filled="true">❤️</span>
      <span class="heart" data-filled="true">❤️</span>
    </div>
    <div id="lives-countdown"></div>

    <div id="zones-strip" class="zones-strip"></div>

    <div class="play-panel">
      <div class="room-actions">
        <button id="play-level-btn">Jouer un niveau ▶</button>
      </div>
      <p id="no-lives-message">Aucune vie restante. Prochaine vie dans <strong id="no-lives-timer">--:--</strong>.</p>
    </div>
  </div>

  <div id="puzzle-screen" class="screen">
    <h1>Match-3 Prototype — Moteur de puzzle</h1>

    <div id="hud">
      <div class="hud-item">
        Mouvements
        <span class="value" id="moves-left">20</span>
      </div>
      <div class="hud-item">
        Score
        <span class="value" id="score">0</span>
      </div>
      <div class="hud-item">
        Objectif
        <span class="value" id="objective">0 / 15 🏋️</span>
      </div>
      <div class="hud-item">
        Argent
        <span class="value" id="money-amount-hud">💰 0</span>
      </div>
    </div>

    <div id="board-wrap">
      <canvas id="board" width="640" height="640"></canvas>
      <div id="overlay">
        <h2 id="overlay-title"></h2>
        <p id="overlay-text"></p>
        <div class="overlay-actions">
          <button id="restart-btn">Rejouer</button>
          <button id="back-to-room-btn" class="secondary">Retour à la salle</button>
        </div>
      </div>
    </div>

    <div id="footer">Prototype isolé du moteur Match-3 — pas d'habillage rénovation/salle/clients à ce stade.</div>
  </div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------
  // Config
  // ---------------------------------------------------------------------
  const GRID_SIZE = 8;               // ajustable
  const SYMBOLS = ["🏋️", "🥤", "👟", "🧤", "🪢", "🎽"]; // haltère, gourde, chaussure, gant, corde à sauter, débardeur
  const MAX_MOVES = 20;
  const TARGET_SYMBOL_INDEX = 0;     // 🏋️ haltère
  const TARGET_COUNT = 15;
  const POINTS_PER_TILE = 10;
  const MONEY_PER_WIN = 100;         // pièces gagnées à chaque victoire
  const MAX_LIVES = 5;
  const LIFE_REGEN_MS = 20 * 60 * 1000; // 20 minutes par vie, ajustable
  const STORAGE_KEY = "match3-reno-save-v1";

  // Zones de la salle (vue isométrique). La zone 0 (vestiaire) est débloquée d'office.
  const ZONES = [
    { id: 0, name: "Vestiaire", icon: "🧥", unlockPrice: 0 },
    { id: 1, name: "Zone Musculation", icon: "🏋️", unlockPrice: 2000 },
    { id: 2, name: "Zone Cardio", icon: "🏃", unlockPrice: 2000 },
  ];

  const BOARD_PX = 640;              // taille logique du board (indépendante du DPR)
  const CELL = BOARD_PX / GRID_SIZE;

  const SWAP_MS = 180;
  const REMOVE_MS = 220;
  const FALL_MS = 240;
  const LERP = 0.28;
  const SWIPE_THRESHOLD = 18; // px (coords écran)

  // Courbes d'easing (t dans [0,1])
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeOutBack = (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  const easeOutQuad = (t) => 1 - (1 - t) * (1 - t);
  const easeInQuad = (t) => t * t;

  // ---------------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------------
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const movesEl = document.getElementById("moves-left");
  const scoreEl = document.getElementById("score");
  const objectiveEl = document.getElementById("objective");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayText = document.getElementById("overlay-text");
  const restartBtn = document.getElementById("restart-btn");
  const backToRoomBtn = document.getElementById("back-to-room-btn");

  const roomScreen = document.getElementById("room-screen");
  const puzzleScreen = document.getElementById("puzzle-screen");
  const playLevelBtn = document.getElementById("play-level-btn");
  const moneyAmountRoomEl = document.getElementById("money-amount-room");
  const moneyAmountHudEl = document.getElementById("money-amount-hud");
  const zonesStripEl = document.getElementById("zones-strip");
  const heartEls = Array.from(document.querySelectorAll("#lives-bar .heart"));
  const livesCountdownEl = document.getElementById("lives-countdown");
  const noLivesMessageEl = document.getElementById("no-lives-message");
  const noLivesTimerEl = document.getElementById("no-lives-timer");

  function setupCanvasResolution() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = BOARD_PX * dpr;
    canvas.height = BOARD_PX * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  setupCanvasResolution();
  window.addEventListener("resize", setupCanvasResolution);

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  let tileId = 0;
  let tiles = [];                 // tuiles vivantes (pour le rendu)
  let grid = [];                  // grid[row][col] -> tuile | null
  let selected = null;            // {row, col}
  let inputLocked = false;
  let gameOver = false;
  let movesLeft = MAX_MOVES;
  let score = 0;
  let collected = 0;

  // Progression de la salle (persistée) - money gagné au Match-3, dépensé en rénovation.
  let money = 0;
  // État de chaque zone, index-aligné avec ZONES : "locked" | "delabre" | "renove".
  let zoneStates = null;

  function defaultZoneStates() {
    return ZONES.map((z, i) => (i === 0 ? "delabre" : "locked"));
  }

  // Vies : nextLifeAt est l'horodatage (ms) auquel la PROCHAINE vie manquante sera
  // accordée. Une seule minuterie à la fois tourne (pas une par vie manquante) -
  // dès qu'elle accorde une vie, elle se relance pour la suivante si besoin.
  let lives = MAX_LIVES;
  let nextLifeAt = null;

  function loadSave() {
    zoneStates = defaultZoneStates();
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (typeof data.money === "number") money = data.money;
      if (typeof data.lives === "number") lives = data.lives;
      if (typeof data.nextLifeAt === "number") nextLifeAt = data.nextLifeAt;

      if (Array.isArray(data.zoneStates) && data.zoneStates.length === ZONES.length) {
        zoneStates = data.zoneStates;
      } else if (typeof data.roomRenovated === "boolean") {
        // Migration depuis l'ancienne sauvegarde à une seule pièce (avant la vue multi-zones).
        zoneStates[0] = data.roomRenovated ? "renove" : "delabre";
      }
    } catch (e) {
      // sauvegarde corrompue ou stockage indisponible : on repart de zéro
    }
  }

  function saveGame() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ money, lives, nextLifeAt, zoneStates }));
    } catch (e) {
      // stockage indisponible (mode privé, quota...) : on continue sans persister
    }
  }

  // Accorde toute vie gagnée pendant que la page était fermée/inactive (peut en
  // accorder plusieurs d'un coup si le délai cumulé le permet).
  function reconcileLives() {
    if (nextLifeAt === null) return;
    const nowTs = Date.now();
    let changed = false;
    while (nextLifeAt !== null && lives < MAX_LIVES && nowTs >= nextLifeAt) {
      lives++;
      nextLifeAt = lives < MAX_LIVES ? nextLifeAt + LIFE_REGEN_MS : null;
      changed = true;
    }
    if (changed) saveGame();
  }

  function loseLife() {
    if (lives <= 0) return;
    lives--;
    if (nextLifeAt === null) nextLifeAt = Date.now() + LIFE_REGEN_MS;
    saveGame();
    updateLivesDisplay();
  }

  function formatCountdown(ms) {
    const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function updateLivesDisplay() {
    heartEls.forEach((el, i) => { el.dataset.filled = i < lives ? "true" : "false"; });

    if (lives < MAX_LIVES && nextLifeAt !== null) {
      const remaining = formatCountdown(nextLifeAt - Date.now());
      livesCountdownEl.textContent = `Prochaine vie dans ${remaining}`;
      if (lives <= 0) {
        noLivesTimerEl.textContent = remaining;
      }
    } else {
      livesCountdownEl.textContent = "";
    }

    noLivesMessageEl.classList.toggle("show", lives <= 0);
    playLevelBtn.disabled = lives <= 0;
  }

  function tickLives() {
    reconcileLives();
    updateLivesDisplay();
  }

  function updateMoneyDisplay() {
    moneyAmountRoomEl.textContent = money;
    moneyAmountHudEl.textContent = `💰 ${money}`;
  }

  function zoneStatusLabel(zone, state) {
    if (state === "locked") return `Débloquer : ${zone.unlockPrice} 💰`;
    return state === "renove" ? "rénové" : "délabré";
  }

  function renderZones() {
    zonesStripEl.innerHTML = "";
    ZONES.forEach((zone, i) => {
      const state = zoneStates[i];

      const el = document.createElement("div");
      el.className = "iso-zone";
      el.dataset.state = state;

      const shape = document.createElement("div");
      shape.className = "iso-shape";

      const icon = document.createElement("div");
      icon.className = "iso-icon";
      icon.textContent = zone.icon;
      shape.appendChild(icon);

      if (state === "locked") {
        const lock = document.createElement("div");
        lock.className = "iso-lock";
        lock.textContent = "🔒";
        shape.appendChild(lock);
      }
      el.appendChild(shape);

      const info = document.createElement("div");
      info.className = "iso-info";
      const nameEl = document.createElement("div");
      nameEl.className = "iso-zone-name";
      nameEl.textContent = zone.name;
      const statusEl = document.createElement("div");
      statusEl.className = "iso-zone-status";
      statusEl.textContent = zoneStatusLabel(zone, state);
      info.appendChild(nameEl);
      info.appendChild(statusEl);
      el.appendChild(info);

      el.addEventListener("click", () => onZoneClick(i));
      zonesStripEl.appendChild(el);
    });
  }

  function onZoneClick(index) {
    const zone = ZONES[index];
    if (zoneStates[index] !== "locked") return; // rénovation par zone : prochaine étape

    const el = zonesStripEl.children[index];
    if (money < zone.unlockPrice) {
      if (el) {
        el.classList.remove("shake");
        void el.offsetWidth; // force le reflow pour pouvoir rejouer l'animation
        el.classList.add("shake");
        setTimeout(() => el.classList.remove("shake"), 400);
      }
      return;
    }

    money -= zone.unlockPrice;
    zoneStates[index] = "delabre";
    saveGame();
    updateMoneyDisplay();
    renderZones();
    const newEl = zonesStripEl.children[index];
    if (newEl) {
      newEl.classList.add("unlocking");
      setTimeout(() => newEl.classList.remove("unlocking"), 650);
    }
  }

  function showScreen(name) {
    const isRoom = name === "room";
    roomScreen.classList.toggle("active", isRoom);
    puzzleScreen.classList.toggle("active", !isRoom);
  }

  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const now = () => performance.now();
  const randSymbol = () => Math.floor(Math.random() * SYMBOLS.length);
  const inBounds = (r, c) => r >= 0 && r < GRID_SIZE && c >= 0 && c < GRID_SIZE;
  const areAdjacent = (a, b) => Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;

  function createTile(row, col, symbolIndex, spawnRow) {
    return {
      id: tileId++,
      symbolIndex,
      row, col,
      x: col * CELL,
      y: (spawnRow !== undefined ? spawnRow : row) * CELL,
      removing: false,
      alpha: 1,
      scale: 1,
      moveAnim: null,   // tween de position explicite (échange / annulation)
      removeAnim: null, // tween d'élimination (pop puis fondu)
    };
  }

  // Démarre un tween de position depuis la position actuellement rendue de la tuile
  // vers sa cible logique (row/col), sans toucher à la lerp générique (gravité).
  function beginMove(tile, duration, ease) {
    tile.moveAnim = {
      t0: now(),
      duration,
      fromX: tile.x, fromY: tile.y,
      toX: tile.col * CELL, toY: tile.row * CELL,
      ease,
    };
  }

  function beginRemove(tile, duration) {
    tile.removing = true;
    tile.removeAnim = { t0: now(), duration };
  }

  // ---------------------------------------------------------------------
  // Génération de grille / détection de matches
  // ---------------------------------------------------------------------
  function buildEmptyGrid() {
    return Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));
  }

  function symbolAt(r, c) {
    const t = grid[r] && grid[r][c];
    return t ? t.symbolIndex : -1;
  }

  // Génère une grille sans alignement de 3+ déjà formé.
  function initGrid() {
    grid = buildEmptyGrid();
    tiles = [];
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        const avoid = new Set();
        if (col >= 2 && symbolAt(row, col - 1) === symbolAt(row, col - 2)) {
          avoid.add(symbolAt(row, col - 1));
        }
        if (row >= 2 && symbolAt(row - 1, col) === symbolAt(row - 2, col)) {
          avoid.add(symbolAt(row - 1, col));
        }
        let sym;
        do { sym = randSymbol(); } while (avoid.has(sym));
        const tile = createTile(row, col, sym);
        grid[row][col] = tile;
        tiles.push(tile);
      }
    }
    ensureSolvable();
  }

  // Retourne la liste des cases (row,col) faisant partie d'un alignement >= 3.
  function findMatches() {
    const matched = new Set(); // clé "row,col"

    // Lignes
    for (let row = 0; row < GRID_SIZE; row++) {
      let runStart = 0;
      for (let col = 1; col <= GRID_SIZE; col++) {
        const prevSym = symbolAt(row, col - 1);
        const curSym = col < GRID_SIZE ? symbolAt(row, col) : -2;
        if (curSym !== prevSym) {
          const runLen = col - runStart;
          if (runLen >= 3 && prevSym !== -1) {
            for (let k = runStart; k < col; k++) matched.add(row + "," + k);
          }
          runStart = col;
        }
      }
    }

    // Colonnes
    for (let col = 0; col < GRID_SIZE; col++) {
      let runStart = 0;
      for (let row = 1; row <= GRID_SIZE; row++) {
        const prevSym = symbolAt(row - 1, col);
        const curSym = row < GRID_SIZE ? symbolAt(row, col) : -2;
        if (curSym !== prevSym) {
          const runLen = row - runStart;
          if (runLen >= 3 && prevSym !== -1) {
            for (let k = runStart; k < row; k++) matched.add(k + "," + col);
          }
          runStart = row;
        }
      }
    }

    return matched;
  }

  function swapGridCells(a, b) {
    const ta = grid[a.row][a.col];
    const tb = grid[b.row][b.col];
    grid[a.row][a.col] = tb;
    grid[b.row][b.col] = ta;
    if (ta) { ta.row = b.row; ta.col = b.col; }
    if (tb) { tb.row = a.row; tb.col = a.col; }
  }

  // Vérifie s'il existe au moins un swap possible qui crée un alignement.
  function hasAnyMove() {
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        if (col < GRID_SIZE - 1 && trySwapCreatesMatch(row, col, row, col + 1)) return true;
        if (row < GRID_SIZE - 1 && trySwapCreatesMatch(row, col, row + 1, col)) return true;
      }
    }
    return false;
  }

  function trySwapCreatesMatch(r1, c1, r2, c2) {
    const a = { row: r1, col: c1 }, b = { row: r2, col: c2 };
    swapGridCells(a, b);
    const matched = findMatches().size > 0;
    swapGridCells(a, b);
    return matched;
  }

  // Si le plateau est bloqué (aucun coup possible) ou a un match résiduel, on rebrasse.
  function ensureSolvable() {
    let attempts = 0;
    while ((findMatches().size > 0 || !hasAnyMove()) && attempts < 200) {
      for (let row = 0; row < GRID_SIZE; row++) {
        for (let col = 0; col < GRID_SIZE; col++) {
          grid[row][col].symbolIndex = randSymbol();
        }
      }
      attempts++;
    }
  }

  // ---------------------------------------------------------------------
  // Gravité / refill
  // ---------------------------------------------------------------------
  function applyGravity() {
    for (let col = 0; col < GRID_SIZE; col++) {
      const existing = [];
      for (let row = 0; row < GRID_SIZE; row++) {
        if (grid[row][col]) existing.push(grid[row][col]);
        grid[row][col] = null;
      }
      let writeRow = GRID_SIZE - 1;
      for (let i = existing.length - 1; i >= 0; i--) {
        const t = existing[i];
        t.row = writeRow;
        t.col = col;
        grid[writeRow][col] = t;
        writeRow--;
      }
      let spawnOffset = 1;
      for (let row = writeRow; row >= 0; row--) {
        const t = createTile(row, col, randSymbol(), -spawnOffset);
        grid[row][col] = t;
        tiles.push(t);
        spawnOffset++;
      }
    }
  }

  // ---------------------------------------------------------------------
  // Boucle de résolution (match -> suppression -> gravité -> cascade)
  // ---------------------------------------------------------------------
  async function resolveCascade() {
    let matched = findMatches();
    while (matched.size > 0) {
      for (const key of matched) {
        const [r, c] = key.split(",").map(Number);
        const t = grid[r][c];
        if (!t) continue;
        beginRemove(t, REMOVE_MS);
        score += POINTS_PER_TILE;
        if (t.symbolIndex === TARGET_SYMBOL_INDEX) collected++;
      }
      updateHud();
      await wait(REMOVE_MS);

      for (const key of matched) {
        const [r, c] = key.split(",").map(Number);
        const t = grid[r][c];
        if (t) {
          tiles = tiles.filter((tile) => tile.id !== t.id);
          grid[r][c] = null;
        }
      }

      applyGravity();
      await wait(FALL_MS);

      matched = findMatches();
    }

    if (!gameOver && !hasAnyMove()) {
      reshuffleBoard();
      await wait(FALL_MS);
    }
  }

  function reshuffleBoard() {
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        grid[row][col].symbolIndex = randSymbol();
      }
    }
    ensureSolvable();
  }

  // ---------------------------------------------------------------------
  // Interaction joueur
  // ---------------------------------------------------------------------
  async function attemptSwap(a, b) {
    if (inputLocked || gameOver) return;
    if (!areAdjacent(a, b)) {
      selected = b;
      return;
    }

    inputLocked = true;
    selected = null;
    swapGridCells(a, b);
    beginMove(grid[a.row][a.col], SWAP_MS, easeOutCubic);
    beginMove(grid[b.row][b.col], SWAP_MS, easeOutCubic);
    await wait(SWAP_MS);

    const matched = findMatches();
    if (matched.size === 0) {
      swapGridCells(a, b); // annule l'échange
      // easeOutBack : léger rebond au retour, pour bien signifier le refus
      beginMove(grid[a.row][a.col], SWAP_MS, easeOutBack);
      beginMove(grid[b.row][b.col], SWAP_MS, easeOutBack);
      await wait(SWAP_MS);
      inputLocked = false;
      return;
    }

    movesLeft--;
    updateHud();
    await resolveCascade();

    inputLocked = false;
    checkEndConditions();
  }

  function checkEndConditions() {
    if (gameOver) return;
    if (collected >= TARGET_COUNT) {
      gameOver = true;
      money += MONEY_PER_WIN;
      saveGame();
      updateMoneyDisplay();
      showOverlay("Victoire !", `Objectif atteint : ${TARGET_COUNT} ${SYMBOLS[TARGET_SYMBOL_INDEX]} collectés en ${MAX_MOVES - movesLeft} mouvements. Score : ${score}. +${MONEY_PER_WIN} 💰`);
    } else if (movesLeft <= 0) {
      gameOver = true;
      loseLife();
      showOverlay("Défaite", `Mouvements épuisés. ${collected}/${TARGET_COUNT} ${SYMBOLS[TARGET_SYMBOL_INDEX]} collectés. Score : ${score}.`);
    }
  }

  function showOverlay(title, text) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlay.classList.add("show");
  }

  function updateHud() {
    movesEl.textContent = movesLeft;
    movesEl.classList.toggle("low", movesLeft <= 5);
    scoreEl.textContent = score;
    objectiveEl.textContent = `${Math.min(collected, TARGET_COUNT)} / ${TARGET_COUNT} ${SYMBOLS[TARGET_SYMBOL_INDEX]}`;
  }

  function resetGame() {
    tileId = 0;
    movesLeft = MAX_MOVES;
    score = 0;
    collected = 0;
    gameOver = false;
    selected = null;
    inputLocked = false;
    overlay.classList.remove("show");
    initGrid();
    updateHud();
  }

  // ---------------------------------------------------------------------
  // Rendu
  // ---------------------------------------------------------------------
  function updatePositions() {
    const t = now();
    for (const tile of tiles) {
      if (tile.moveAnim) {
        const { t0, duration, fromX, fromY, toX, toY, ease } = tile.moveAnim;
        const p = Math.min(1, (t - t0) / duration);
        const e = ease(p);
        tile.x = fromX + (toX - fromX) * e;
        tile.y = fromY + (toY - fromY) * e;
        if (p >= 1) tile.moveAnim = null;
      } else {
        // Repositionnement générique (utilisé pour la gravité, pour l'instant) :
        // lisse par lerp exponentiel vers la position logique cible.
        const targetX = tile.col * CELL;
        const targetY = tile.row * CELL;
        tile.x += (targetX - tile.x) * LERP;
        tile.y += (targetY - tile.y) * LERP;
        if (Math.abs(targetX - tile.x) < 0.5) tile.x = targetX;
        if (Math.abs(targetY - tile.y) < 0.5) tile.y = targetY;
      }

      if (tile.removeAnim) {
        const { t0, duration } = tile.removeAnim;
        const p = Math.min(1, (t - t0) / duration);
        if (p < 0.35) {
          // petit "pop" : léger agrandissement au moment de l'élimination
          tile.scale = 1 + 0.18 * easeOutQuad(p / 0.35);
          tile.alpha = 1;
        } else {
          // puis rétrécissement + fondu jusqu'à disparition
          const pp = (p - 0.35) / 0.65;
          tile.scale = 1.18 * (1 - easeInQuad(pp));
          tile.alpha = 1 - pp;
        }
        if (p >= 1) tile.removeAnim = null;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, BOARD_PX, BOARD_PX);

    // damier de fond (couleurs pleines : les remplissages semi-transparents
    // désaturent les glyphes emoji couleur sur certains moteurs de rendu logiciel)
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        ctx.fillStyle = (row + col) % 2 === 0 ? "#2a3042" : "#262b3c";
        roundRect(ctx, col * CELL + 2, row * CELL + 2, CELL - 4, CELL - 4, 10);
        ctx.fill();
      }
    }

    // sélection
    if (selected) {
      ctx.strokeStyle = "#4fd1c5";
      ctx.lineWidth = 3;
      roundRect(ctx, selected.col * CELL + 3, selected.row * CELL + 3, CELL - 6, CELL - 6, 10);
      ctx.stroke();
    }

    // tuiles
    const fontSize = CELL * 0.56;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `${fontSize}px sans-serif`;
    for (const t of tiles) {
      if (t.removing && t.alpha <= 0) continue;
      ctx.save();
      ctx.globalAlpha = t.alpha;
      const cx = t.x + CELL / 2;
      const cy = t.y + CELL / 2;
      ctx.translate(cx, cy);
      ctx.scale(t.scale, t.scale);
      ctx.fillText(SYMBOLS[t.symbolIndex], 0, 1);
      ctx.restore();
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function loop() {
    updatePositions();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------------------------------------------------------------------
  // Entrées (clic + swipe)
  // ---------------------------------------------------------------------
  function pixelToCell(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (BOARD_PX / rect.width);
    const y = (clientY - rect.top) * (BOARD_PX / rect.height);
    return {
      row: Math.min(GRID_SIZE - 1, Math.max(0, Math.floor(y / CELL))),
      col: Math.min(GRID_SIZE - 1, Math.max(0, Math.floor(x / CELL))),
    };
  }

  let pointerDown = null; // {clientX, clientY, cell}
  let dragHandled = false;

  canvas.addEventListener("pointerdown", (e) => {
    if (inputLocked || gameOver) return;
    canvas.setPointerCapture(e.pointerId);
    const cell = pixelToCell(e.clientX, e.clientY);
    pointerDown = { clientX: e.clientX, clientY: e.clientY, cell };
    dragHandled = false;
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!pointerDown || dragHandled || inputLocked || gameOver) return;
    const dx = e.clientX - pointerDown.clientX;
    const dy = e.clientY - pointerDown.clientY;
    if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;

    dragHandled = true;
    let target = { ...pointerDown.cell };
    if (Math.abs(dx) > Math.abs(dy)) {
      target.col += dx > 0 ? 1 : -1;
    } else {
      target.row += dy > 0 ? 1 : -1;
    }
    if (inBounds(target.row, target.col)) {
      attemptSwap(pointerDown.cell, target);
    }
  });

  canvas.addEventListener("pointerup", (e) => {
    if (!pointerDown) return;
    if (!dragHandled && !inputLocked && !gameOver) {
      const cell = pointerDown.cell;
      if (!selected) {
        selected = cell;
      } else if (selected.row === cell.row && selected.col === cell.col) {
        selected = null;
      } else if (areAdjacent(selected, cell)) {
        const from = selected;
        attemptSwap(from, cell);
      } else {
        selected = cell;
      }
    }
    pointerDown = null;
  });

  canvas.addEventListener("pointercancel", () => { pointerDown = null; });

  restartBtn.addEventListener("click", resetGame);
  backToRoomBtn.addEventListener("click", () => showScreen("room"));
  playLevelBtn.addEventListener("click", () => {
    if (lives <= 0) return; // défense en profondeur - le bouton est déjà désactivé
    showScreen("puzzle");
    resetGame();
  });

  // ---------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------
  loadSave();
  reconcileLives(); // rattrape les vies gagnées pendant que la page était fermée
  updateMoneyDisplay();
  updateLivesDisplay();
  renderZones();
  resetGame();
  showScreen("room");
  loop();
  setInterval(tickLives, 1000);
})();
</script>
</body>
</html>
