<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Salle de Sport — Prototype boucle de jeu</title>
<style>
  :root {
    --bg-0: #1b1420;
    --bg-1: #241a2c;
    --panel: #2c2036;
    --panel-line: #40304e;
    --accent: #ff5f6d;
    --accent-2: #ffc93c;
    --text: #f2eefb;
    --text-dim: #b2a4c4;
    --good: #4ade80;
    --mid: #ffc93c;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg-0); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none;
  }
  #app {
    max-width: 480px; margin: 0 auto; height: 100dvh;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-0) 60%);
    position: relative;
  }

  header {
    padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 8px;
    border-bottom: 1px solid var(--panel-line);
  }
  .top-row { display: flex; justify-content: space-between; align-items: baseline; }
  .room-name { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); }
  .level-badge { font-size: 20px; font-weight: 800; color: var(--accent-2); }
  .xp-bar-track {
    height: 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--panel-line);
    overflow: hidden;
  }
  .xp-bar-fill {
    height: 100%; width: 0%; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .25s ease;
  }
  .xp-label { font-size: 11px; color: var(--text-dim); text-align: right; }

  #stage {
    flex: 1; position: relative; display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden;
  }
  #room-backdrop {
    position: absolute; inset: 0; z-index: 0; opacity: 0; transition: opacity .5s ease;
  }
  #room-backdrop.show { opacity: 1; }
  #room-backdrop svg { width: 100%; height: 100%; display: block; }

  .aura {
    position: absolute; z-index: 1; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,201,60,.35), transparent 70%);
    opacity: 0; transition: opacity .4s ease; pointer-events: none;
  }
  .aura.on { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  #char-wrap { position: relative; z-index: 2; margin-bottom: 8px; transform-origin: bottom center; }
  #char-svg { width: 220px; height: auto; display: block; overflow: visible; }
  #char-wrap.bump { animation: bump .45s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.22,.85); } 70% { transform: scale(.92,1.1); } 100% { transform: scale(1); } }

  .floor-crack { position: absolute; z-index: 1; bottom: 0; left: 50%; translate: -50% 0; width: 220px; height: 14px;
    opacity: 0; transition: opacity .4s; pointer-events: none; }
  .floor-crack.on { opacity: .55; }

  .floater {
    position: absolute; font-weight: 800; font-size: 20px; pointer-events: none;
    animation: floatUp 1s ease-out forwards;
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
    white-space: nowrap;
  }
  @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(.8); } 20% { transform: translateY(-10px) scale(1.15); }
    100% { opacity: 0; transform: translateY(-70px) scale(1); } }

  #toast {
    position: absolute; top: 70px; left: 50%; translate: -50% 0;
    background: var(--panel); border: 1px solid var(--accent-2); color: var(--accent-2);
    padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; z-index: 20;
  }
  #toast.show { animation: toast 2.6s ease forwards; }
  @keyframes toast {
    0% { opacity: 0; transform: translate(-50%, -10px); }
    12% { opacity: 1; transform: translate(-50%, 0); }
    85% { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -10px); }
  }

  #minigame {
    padding: 18px 20px 26px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    border-top: 1px solid var(--panel-line); background: var(--bg-1);
  }
  .stats-row { width: 100%; display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }
  .beat-zone { position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
  .ring-outer {
    position: absolute; width: 150px; height: 150px; border-radius: 50%;
    border: 3px dashed var(--panel-line);
  }
  .ring-target {
    position: absolute; width: 78px; height: 78px; border-radius: 50%;
    border: 3px solid var(--accent-2); opacity: .6;
  }
  #tap-btn {
    position: relative; width: 132px; height: 132px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #ff8b8b, var(--accent));
    color: white; font-weight: 800; font-size: 15px; letter-spacing: .04em;
    box-shadow: 0 10px 26px rgba(255,95,109,.45), inset 0 -6px 12px rgba(0,0,0,.25);
    transition: transform .08s ease;
  }
  #tap-btn:active { transform: scale(.9); }
  #reset-btn {
    margin-top: 4px; background: none; border: 1px solid var(--panel-line); color: var(--text-dim);
    font-size: 11px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top-row">
      <div class="room-name" id="room-name">Salle de départ</div>
      <div class="level-badge" id="level-label">Niveau 1</div>
    </div>
    <div class="xp-bar-track"><div class="xp-bar-fill" id="xp-fill"></div></div>
    <div class="xp-label" id="xp-label">0 / 100 XP</div>
  </header>

  <div id="stage">
    <div id="room-backdrop">
      <svg id="room-svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice"></svg>
    </div>
    <div id="toast"></div>
    <div class="aura" id="aura"></div>
    <svg class="floor-crack" id="floor-crack" viewBox="0 0 220 14">
      <path d="M10 2 L40 10 L60 4 L90 12 L120 3 L150 11 L180 5 L210 9" stroke="#000" stroke-width="2" fill="none" opacity=".5"/>
    </svg>
    <div id="char-wrap">
      <svg id="char-svg" viewBox="0 0 280 260"></svg>
    </div>
  </div>

  <div id="minigame">
    <div class="stats-row">
      <span id="reps-label">0 répétitions</span>
      <span id="best-label">Meilleur combo: 0</span>
    </div>
    <div class="beat-zone">
      <div class="ring-outer"></div>
      <div class="ring-target"></div>
      <button id="tap-btn">S'ENTRAÎNER</button>
    </div>
    <button id="reset-btn">Réinitialiser la progression</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const ROOMS = [
    { minLevel: 1,   name: "Salle de départ" },
    { minLevel: 20,  name: "Salle 2" },
    { minLevel: 40,  name: "Salle 3 — Premium" },
    { minLevel: 70,  name: "Salle 4 — ça craque" },
    { minLevel: 100, name: "Méga Salle" },
  ];

  function tierForLevel(level) {
    let idx = 0;
    for (let i = 0; i < ROOMS.length; i++) if (level >= ROOMS[i].minLevel) idx = i;
    return idx;
  }
  function roomNameForLevel(level) { return ROOMS[tierForLevel(level)].name; }
  function xpToNext(level) { return Math.round(6 * level * level + 40 * level + 60); }

  const SAVE_KEY = "salle-sport-prototype-save-v1";
  let state = { level: 1, xp: 0, reps: 0, bestCombo: 0, combo: 0 };
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (saved) state = Object.assign(state, saved);
  } catch (e) {}

  function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }

  const el = {
    roomName: document.getElementById("room-name"),
    levelLabel: document.getElementById("level-label"),
    xpFill: document.getElementById("xp-fill"),
    xpLabel: document.getElementById("xp-label"),
    repsLabel: document.getElementById("reps-label"),
    bestLabel: document.getElementById("best-label"),
    charSvg: document.getElementById("char-svg"),
    charWrap: document.getElementById("char-wrap"),
    stage: document.getElementById("stage"),
    roomBackdrop: document.getElementById("room-backdrop"),
    roomSvg: document.getElementById("room-svg"),
    aura: document.getElementById("aura"),
    crack: document.getElementById("floor-crack"),
    toast: document.getElementById("toast"),
    tapBtn: document.getElementById("tap-btn"),
    resetBtn: document.getElementById("reset-btn"),
  };

  const OUTLINE = "#241a14";
  const SKIN = "#ffcf9e";
  const SKIN_SHADE = "#f0ab6e";
  const HAIR = "#3c2415";
  const SHIRT = "#20c4a6";
  const SHIRT_DARK = "#149280";
  const SHORTS = "#ff7a3d";
  const SHORTS_DARK = "#e05f28";

  const TIER_SHAPES = [
    { shoulderW: 34, waistRatio: .82, armW: 10, armLen: 56, legW: 13, legLen: 54, headR: 25, neckLen: 14, torsoH: 76, armRotate: 2,  accessory: "none",      shirt: "full",  mouth: "smileClosed" },
    { shoulderW: 47, waistRatio: .68, armW: 15, armLen: 61, legW: 17, legLen: 57, headR: 23, neckLen: 11, torsoH: 80, armRotate: 7,  accessory: "wristband", shirt: "full",  mouth: "smileTeeth" },
    { shoulderW: 63, waistRatio: .56, armW: 21, armLen: 66, legW: 21, legLen: 59, headR: 21, neckLen: 7,  torsoH: 84, armRotate: 15, accessory: "shades",    shirt: "full",  mouth: "smirk" },
    { shoulderW: 81, waistRatio: .48, armW: 28, armLen: 72, legW: 25, legLen: 61, headR: 19, neckLen: 3,  torsoH: 88, armRotate: 25, accessory: "bandana",   shirt: "torn",  mouth: "gritted" },
    { shoulderW: 101,waistRatio: .44, armW: 36, armLen: 78, legW: 29, legLen: 63, headR: 17, neckLen: 0,  torsoH: 90, armRotate: 35, accessory: "crown",     shirt: "shred", mouth: "grinBig" },
  ];
  const TIER_END = [20, 40, 70, 100, 160];

  function roomShell(id, wallUpper, wallLower, trim, tileA, tileB, baseboard, spotColor, spotOpacity, matColor, decorSvg) {
    return `
      <defs>
        <pattern id="floor-tile-${id}" width="50" height="50" patternUnits="userSpaceOnUse">
          <rect width="50" height="50" fill="${tileA}"/>
          <rect width="25" height="25" fill="${tileB}"/>
          <rect x="25" y="25" width="25" height="25" fill="${tileB}"/>
        </pattern>
        <radialGradient id="spotlight-${id}" cx="50%" cy="35%" r="60%">
          <stop offset="0%" stop-color="${spotColor}" stop-opacity="${spotOpacity}"/>
          <stop offset="100%" stop-color="${spotColor}" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <rect x="0" y="0" width="400" height="430" fill="${wallUpper}"/>
      <rect x="0" y="250" width="400" height="180" fill="${wallLower}"/>
      <rect x="0" y="246" width="400" height="8" fill="${trim}"/>
      <rect x="0" y="420" width="400" height="180" fill="url(#floor-tile-${id})"/>
      <rect x="0" y="420" width="400" height="6" fill="${baseboard}"/>

      <ellipse cx="200" cy="120" rx="230" ry="220" fill="url(#spotlight-${id})"/>

      <g stroke="${OUTLINE}" stroke-width="5" stroke-linejoin="round">
        ${decorSvg}
      </g>

      <ellipse cx="200" cy="560" rx="72" ry="16" fill="${matColor}" opacity=".8"/>
    `;
  }

  function buildRoom0() {
    const decor = `
      <rect x="36" y="70" width="108" height="160" rx="10" fill="#cdeaf2"/>
      <path d="M55 90 L120 200 M120 90 L60 190" stroke="#9fd2de" stroke-width="4" fill="none"/>
      <path d="M80 78 L104 78" stroke="#d8564a" stroke-width="8" stroke-linecap="round"/>

      <rect x="298" y="86" width="76" height="104" rx="6" fill="#ffd23f" transform="rotate(-4 336 138)"/>
      <g transform="rotate(-4 336 138)">
        <circle cx="336" cy="100" r="5" fill="#e0473b"/>
        <text x="336" y="128" font-family="Arial, sans-serif" font-weight="900" font-size="17" fill="${OUTLINE}" text-anchor="middle" letter-spacing="1">ZOKAU</text>
        <circle cx="322" cy="158" r="9" fill="${OUTLINE}"/>
        <rect x="317" y="150" width="10" height="26" rx="3" fill="${OUTLINE}"/>
        <circle cx="350" cy="158" r="9" fill="${OUTLINE}"/>
      </g>

      <rect x="252" y="330" width="14" height="120" fill="#8a5a3a"/>
      <rect x="242" y="330" width="94" height="14" rx="4" fill="#8a5a3a"/>
      <rect x="242" y="384" width="94" height="14" rx="4" fill="#8a5a3a"/>
      <g stroke-width="4">
        <rect x="248" y="345" width="18" height="16" rx="4" fill="#e0473b"/>
        <rect x="272" y="345" width="18" height="16" rx="4" fill="#3d7fd6"/>
        <rect x="296" y="345" width="18" height="16" rx="4" fill="#4bbf7a"/>
        <rect x="320" y="345" width="18" height="16" rx="4" fill="#ffd23f"/>
      </g>

      <rect x="42" y="380" width="10" height="70" fill="#5c5c5c"/>
      <ellipse cx="47" cy="384" rx="26" ry="9" fill="#e0473b"/>
      <ellipse cx="47" cy="398" rx="22" ry="7" fill="#3d7fd6"/>
      <ellipse cx="47" cy="410" rx="18" ry="6" fill="#ffd23f"/>

      <line x1="356" y1="60" x2="356" y2="150" stroke="#5c5c5c" stroke-width="4"/>
      <rect x="336" y="150" width="40" height="86" rx="18" fill="#d8564a"/>
    `;
    return roomShell(0, "#ff8a6b", "#2fa89b", "#1c7d73", "#5b6a72", "#66767f", "#2a3338", "#fff3c4", ".55", "#8a3b32", decor);
  }

  function buildRoom1() {
    const decor = `
      <rect x="32" y="66" width="116" height="168" rx="12" fill="#ffffff"/>
      <rect x="40" y="74" width="100" height="152" rx="8" fill="#e8f4fb"/>
      <path d="M56 92 L124 200" stroke="#ffffff" stroke-width="6" opacity=".7" fill="none"/>

      <circle cx="336" cy="132" r="36" fill="#ffffff"/>
      <circle cx="336" cy="132" r="36" fill="none" stroke-width="4"/>
      <g stroke-width="3">
        <line x1="336" y1="132" x2="336" y2="108"/>
        <line x1="336" y1="132" x2="352" y2="140"/>
      </g>
      <circle cx="336" cy="132" r="3.5" fill="#e0473b" stroke="none"/>
      <g stroke-width="2.5">
        <line x1="336" y1="100" x2="336" y2="106"/>
        <line x1="336" y1="158" x2="336" y2="164"/>
        <line x1="302" y1="132" x2="308" y2="132"/>
        <line x1="364" y1="132" x2="370" y2="132"/>
      </g>

      <rect x="252" y="330" width="14" height="120" fill="#aab7bf"/>
      <rect x="242" y="330" width="94" height="14" rx="4" fill="#aab7bf"/>
      <rect x="242" y="384" width="94" height="14" rx="4" fill="#aab7bf"/>
      <g stroke-width="4">
        <g fill="#2f4f7a"><rect x="247" y="344" width="20" height="18" rx="5"/><rect x="271" y="344" width="20" height="18" rx="5"/><rect x="295" y="344" width="20" height="18" rx="5"/><rect x="319" y="344" width="20" height="18" rx="5"/></g>
        <g fill="#ffffff" stroke-width="3"><circle cx="252" cy="353" r="5"/><circle cx="262" cy="353" r="5"/><circle cx="276" cy="353" r="5"/><circle cx="286" cy="353" r="5"/><circle cx="300" cy="353" r="5"/><circle cx="310" cy="353" r="5"/><circle cx="324" cy="353" r="5"/><circle cx="334" cy="353" r="5"/></g>
      </g>

      <rect x="42" y="392" width="12" height="58" fill="#aab7bf"/>
      <ellipse cx="48" cy="396" rx="28" ry="8" fill="#dfe6ea"/>
      <ellipse cx="48" cy="410" rx="24" ry="7" fill="#c3ccd2"/>
      <ellipse cx="48" cy="422" rx="20" ry="6" fill="#eef2f5"/>

      <path d="M348 372 Q340 345 358 330 Q376 345 366 372 Z" fill="#4bbf7a"/>
      <path d="M348 372 Q345 350 358 336" stroke="#2f8a54" stroke-width="3" fill="none"/>
      <path d="M334 396 L382 396 L376 450 L340 450 Z" fill="#ffffff"/>
      <path d="M334 396 L382 396 L379 408 L337 408 Z" fill="#e8f4fb"/>
    `;
    return roomShell(1, "#eaf4fb", "#6fa8d6", "#ffffff", "#dfe6ea", "#eef2f5", "#4a6f8a", "#eaf6ff", ".5", "#2f6fb0", decor);
  }

  const ROOM_BUILDERS = [buildRoom0, buildRoom1];

  let currentRoomTier = -1;
  function updateRoomBackdrop(tier) {
    if (tier === currentRoomTier) return;
    const builder = ROOM_BUILDERS[tier];
    const isFirstRender = currentRoomTier === -1;
    el.roomBackdrop.classList.remove("show");
    const swap = () => {
      if (builder) {
        el.roomSvg.innerHTML = builder();
        requestAnimationFrame(() => el.roomBackdrop.classList.add("show"));
      }
      currentRoomTier = tier;
    };
    if (isFirstRender) swap();
    else setTimeout(swap, 500);
  }

  function buildCharacter(level) {
    const tier = tierForLevel(level);
    const shape = TIER_SHAPES[tier];
    const tierStart = ROOMS[tier].minLevel;
    const frac = Math.max(0, Math.min(1, (level - tierStart) / (TIER_END[tier] - tierStart)));
    const grow = 1 + 0.12 * frac;

    const cx = 140;
    const shoulderW = shape.shoulderW * grow;
    const waistW = shoulderW * shape.waistRatio;
    const armW = shape.armW * grow;
    const armLen = shape.armLen * grow;
    const legW = shape.legW * grow;
    const legLen = shape.legLen * grow;
    const headR = shape.headR;
    const neckLen = shape.neckLen;
    const torsoBottom = 172;
    const torsoTop = torsoBottom - shape.torsoH;
    const neckTop = torsoTop - neckLen;
    const headCy = neckTop - headR;
    const armRotate = shape.armRotate;
    const ow = 3 + tier * 0.4;

    const svg = [];
    svg.push(`<ellipse cx="${cx}" cy="250" rx="${shoulderW+18}" ry="9" fill="rgba(0,0,0,.3)"/>`);

    function arm(side) {
      const sign = side === "left" ? -1 : 1;
      const pivotX = cx + sign * shoulderW * 0.8;
      const pivotY = torsoTop + 10;
      const rectX = pivotX + (sign === -1 ? -armW : 0);
      const bicepCy = pivotY + armLen * 0.3;
      const bicepR = tier >= 1 ? armW * 0.6 + tier * 1.4 : 0;
      let extra = "";
      if (shape.accessory === "wristband") {
        const wy = pivotY + armLen - 12;
        extra = `<rect x="${rectX-1.5}" y="${wy}" width="${armW+3}" height="9" rx="3" fill="#ffd23f" stroke="${OUTLINE}" stroke-width="${ow}"/>`;
      }
      return `<g transform="rotate(${sign * armRotate} ${pivotX} ${pivotY})">
        <rect x="${rectX}" y="${pivotY}" width="${armW}" height="${armLen}" rx="${armW/2}" fill="${SKIN}" stroke="${OUTLINE}" stroke-width="${ow}"/>
        ${bicepR ? `<circle cx="${pivotX + sign*armW*0.5}" cy="${bicepCy}" r="${bicepR}" fill="${SKIN_SHADE}" stroke="${OUTLINE}" stroke-width="${ow*0.7}"/>` : ""}
        ${extra}
      </g>`;
    }
    svg.push(arm("left"));
    svg.push(arm("right"));

    const legInset = waistW * 0.6;
    svg.push(`<rect x="${cx-legInset-legW/2}" y="${torsoBottom-4}" width="${legW}" height="${legLen}" rx="${legW*0.4}" fill="${SKIN}" stroke="${OUTLINE}" stroke-width="${ow}"/>`);
    svg.push(`<rect x="${cx+legInset-legW/2}" y="${torsoBottom-4}" width="${legW}" height="${legLen}" rx="${legW*0.4}" fill="${SKIN}" stroke="${OUTLINE}" stroke-width="${ow}"/>`);

    const torsoPath = `M ${cx-shoulderW} ${torsoTop} Q ${cx} ${torsoTop-8-tier*2} ${cx+shoulderW} ${torsoTop} L ${cx+waistW} ${torsoBottom} Q ${cx} ${torsoBottom+8} ${cx-waistW} ${torsoBottom} Z`;
    svg.push(`<path d="${torsoPath}" fill="${SKIN}" stroke="${OUTLINE}" stroke-width="${ow}"/>`);

    if (tier >= 3) {
      const pecY = torsoTop + shape.torsoH * 0.3;
      svg.push(`<circle cx="${cx-shoulderW*0.34}" cy="${pecY}" r="${shoulderW*0.3}" fill="${SKIN_SHADE}" opacity=".55"/>`);
      svg.push(`<circle cx="${cx+shoulderW*0.34}" cy="${pecY}" r="${shoulderW*0.3}" fill="${SKIN_SHADE}" opacity=".55"/>`);
      for (let i = 0; i < 3; i++) {
        const y = torsoTop + shape.torsoH * 0.55 + i * (shape.torsoH * 0.14);
        const w = waistW * (1 - i * 0.08);
        svg.push(`<path d="M ${cx-w*0.5} ${y} Q ${cx} ${y+6} ${cx+w*0.5} ${y}" stroke="${SKIN_SHADE}" stroke-width="2.5" fill="none" opacity=".7"/>`);
      }
    }

    if (shape.shirt !== "shred") {
      const shirtBottom = torsoTop + shape.torsoH * (shape.shirt === "torn" ? 0.6 : 0.72);
      let shirtPath = `M ${cx-shoulderW*0.94} ${torsoTop+4} Q ${cx} ${torsoTop-6-tier*2} ${cx+shoulderW*0.94} ${torsoTop+4} L ${cx+waistW*1.02} ${shirtBottom} `;
      if (shape.shirt === "torn") {
        shirtPath += `L ${cx+waistW*0.7} ${shirtBottom-10} L ${cx+waistW*0.3} ${shirtBottom} L ${cx} ${shirtBottom-8} L ${cx-waistW*0.3} ${shirtBottom} L ${cx-waistW*0.7} ${shirtBottom-10} `;
      }
      shirtPath += `L ${cx-waistW*1.02} ${shirtBottom} Z`;
      svg.push(`<path d="${shirtPath}" fill="${SHIRT}" stroke="${OUTLINE}" stroke-width="${ow}"/>`);
      svg.push(`<line x1="${cx}" y1="${torsoTop+10}" x2="${cx}" y2="${shirtBottom-6}" stroke="${SHIRT_DARK}" stroke-width="2" opacity=".7"/>`);
    } else {
      svg.push(`<path d="M ${cx-shoulderW*0.5} ${torsoTop+2} Q ${cx} ${torsoTop-4} ${cx+shoulderW*0.5} ${torsoTop+2} L ${cx+shoulderW*0.3} ${torsoTop+shape.torsoH*0.22} L ${cx-shoulderW*0.3} ${torsoTop+shape.torsoH*0.22} Z" fill="${SHIRT}" stroke="${OUTLINE}" stroke-width="${ow}"/>`);
    }

    const shortsTop = torsoBottom - 14;
    svg.push(`<path d="M ${cx-waistW*1.05} ${shortsTop} L ${cx+waistW*1.05} ${shortsTop} L ${cx+legInset+legW*0.7} ${torsoBottom+16} L ${cx} ${torsoBottom+6} L ${cx-legInset-legW*0.7} ${torsoBottom+16} Z" fill="${SHORTS}" stroke="${OUTLINE}" stroke-width="${ow}"/>`);
    svg.push(`<line x1="${cx-waistW*0.9}" y1="${shortsTop+6}" x2="${cx+waistW*0.9}" y2="${shortsTop+6}" stroke="${SHORTS_DARK}" stroke-width="2" opacity=".7"/>`);

    if (neckLen > 0) {
      svg.push(`<rect x="${cx-8}" y="${neckTop}" width="16" height="${neckLen+4}" rx="5" fill="${SKIN}" stroke="${OUTLINE}" stroke-width="${ow}"/>`);
    }

    svg.push(`<circle cx="${cx}" cy="${headCy}" r="${headR}" fill="${SKIN}" stroke="${OUTLINE}" stroke-width="${ow}"/>`);
    svg.push(`<path d="M ${cx-headR*0.95} ${headCy-headR*0.35} Q ${cx} ${headCy-headR*1.55} ${cx+headR*0.95} ${headCy-headR*0.35} Q ${cx+headR*0.5} ${headCy-headR*0.75} ${cx} ${headCy-headR*0.8} Q ${cx-headR*0.5} ${headCy-headR*0.75} ${cx-headR*0.95} ${headCy-headR*0.35} Z" fill="${HAIR}" stroke="${OUTLINE}" stroke-width="${ow*0.7}"/>`);

    const eyeDx = headR * 0.42, eyeY = headCy - headR * 0.02, eyeR = headR * 0.16;
    if (shape.accessory === "shades" || shape.accessory === "bandana" || shape.accessory === "crown") {
      svg.push(`<rect x="${cx-headR*0.75}" y="${eyeY-eyeR*1.1}" width="${headR*1.5}" height="${eyeR*2.2}" rx="${eyeR}" fill="#1c1c1c" stroke="${OUTLINE}" stroke-width="${ow*0.7}"/>`);
      svg.push(`<rect x="${cx-eyeR*0.3}" y="${eyeY-eyeR*1.1}" width="${eyeR*0.6}" height="${eyeR*2.2}" fill="${SKIN}"/>`);
    } else {
      [-1, 1].forEach(s => {
        svg.push(`<circle cx="${cx+s*eyeDx}" cy="${eyeY}" r="${eyeR}" fill="#fff" stroke="${OUTLINE}" stroke-width="${ow*0.6}"/>`);
        svg.push(`<circle cx="${cx+s*eyeDx}" cy="${eyeY}" r="${eyeR*0.5}" fill="#241a14"/>`);
        svg.push(`<path d="M ${cx+s*eyeDx-eyeR} ${eyeY-eyeR*1.7} q ${eyeR} ${tier>=2?-eyeR*0.6:-eyeR*0.2} ${eyeR*2} 0" stroke="${HAIR}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`);
      });
    }

    const mouthY = headCy + headR * 0.45, mouthW = headR * 0.55;
    if (shape.mouth === "smileClosed") {
      svg.push(`<path d="M ${cx-mouthW*0.5} ${mouthY} Q ${cx} ${mouthY+mouthW*0.5} ${cx+mouthW*0.5} ${mouthY}" stroke="${OUTLINE}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`);
    } else if (shape.mouth === "gritted") {
      svg.push(`<rect x="${cx-mouthW*0.55}" y="${mouthY-4}" width="${mouthW*1.1}" height="9" rx="2" fill="#fff" stroke="${OUTLINE}" stroke-width="2"/>`);
      for (let i = 1; i < 4; i++) svg.push(`<line x1="${cx-mouthW*0.55+i*mouthW*0.275}" y1="${mouthY-4}" x2="${cx-mouthW*0.55+i*mouthW*0.275}" y2="${mouthY+5}" stroke="${OUTLINE}" stroke-width="1.5"/>`);
    } else {
      const smileDrop = shape.mouth === "grinBig" ? mouthW * 0.85 : mouthW * 0.6;
      svg.push(`<path d="M ${cx-mouthW*0.6} ${mouthY-2} Q ${cx} ${mouthY+smileDrop} ${cx+mouthW*0.6} ${mouthY-2} Z" fill="#7a2d24" stroke="${OUTLINE}" stroke-width="2.5"/>`);
      svg.push(`<path d="M ${cx-mouthW*0.55} ${mouthY} Q ${cx} ${mouthY+smileDrop*0.5} ${cx+mouthW*0.55} ${mouthY} Z" fill="#fff"/>`);
    }

    if (shape.accessory === "bandana") {
      svg.push(`<path d="M ${cx-headR*1.02} ${headCy-headR*0.15} Q ${cx} ${headCy-headR*1.05} ${cx+headR*1.02} ${headCy-headR*0.15} L ${cx+headR*1.02} ${headCy-headR*0.55} Q ${cx} ${headCy-headR*1.35} ${cx-headR*1.02} ${headCy-headR*0.55} Z" fill="#e0473b" stroke="${OUTLINE}" stroke-width="${ow*0.7}"/>`);
    }
    if (shape.accessory === "crown") {
      svg.push(`<path d="M ${cx-headR*0.95} ${headCy-headR*0.6} Q ${cx} ${headCy-headR*1.5} ${cx+headR*0.95} ${headCy-headR*0.6} L ${cx+headR*1.0} ${headCy-headR*0.3} L ${cx-headR*1.0} ${headCy-headR*0.3} Z" fill="#ffd23f" stroke="${OUTLINE}" stroke-width="${ow*0.7}"/>`);
      svg.push(`<path d="M ${cx-5} ${headCy-headR*1.35} l 3 -9 3 9 -3 -3 z" fill="#fff" stroke="${OUTLINE}" stroke-width="1.5"/>`);
    }

    if (tier >= 3) {
      svg.push(`<g opacity=".9" stroke="#ffe27a" stroke-width="2.5" fill="none">
        <path d="M ${cx-shoulderW-16} ${torsoTop+20} l 10 6 -8 4 10 6"/>
        <path d="M ${cx+shoulderW+16} ${torsoTop+50} l -10 6 8 4 -10 6"/>
      </g>`);
    }

    return svg.join("");
  }

  function render(animBump) {
    const level = state.level;
    const tier = tierForLevel(level);
    const need = xpToNext(level);

    el.roomName.textContent = roomNameForLevel(level);
    el.levelLabel.textContent = "Niveau " + level;
    el.xpFill.style.width = Math.min(100, (state.xp / need) * 100) + "%";
    el.xpLabel.textContent = `${state.xp} / ${need} XP`;
    el.repsLabel.textContent = state.reps + " répétitions";
    el.bestLabel.textContent = "Meilleur combo: " + state.bestCombo;

    el.charSvg.innerHTML = buildCharacter(level);
    el.aura.classList.toggle("on", tier >= 3);
    el.crack.classList.toggle("on", tier >= 3);
    updateRoomBackdrop(tier);

    if (animBump) {
      el.charWrap.classList.remove("bump");
      void el.charWrap.offsetWidth;
      el.charWrap.classList.add("bump");
    }
  }

  function showToast(text) {
    el.toast.textContent = text;
    el.toast.classList.remove("show");
    void el.toast.offsetWidth;
    el.toast.classList.add("show");
  }

  function floatText(text, color) {
    const f = document.createElement("div");
    f.className = "floater";
    f.textContent = text;
    f.style.color = color;
    f.style.left = (46 + Math.random() * 8) + "%";
    f.style.bottom = "40%";
    el.stage.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }

  function gainXp(amount) {
    const prevTier = tierForLevel(state.level);
    state.xp += amount;
    let leveledUp = false;
    while (state.xp >= xpToNext(state.level)) {
      state.xp -= xpToNext(state.level);
      state.level += 1;
      leveledUp = true;
    }
    render(leveledUp);
    if (leveledUp) {
      const newTier = tierForLevel(state.level);
      if (newTier > prevTier) {
        showToast("🏋️ " + roomNameForLevel(state.level) + " débloquée !");
      } else {
        showToast("Niveau " + state.level + " !");
      }
    }
    save();
  }

  const BEAT_PERIOD = 1100;
  let beatStart = performance.now();

  function beatScale(now) {
    const phase = ((now - beatStart) % BEAT_PERIOD) / BEAT_PERIOD;
    return 0.45 + 0.85 * (0.5 - 0.5 * Math.cos(phase * Math.PI * 2));
  }

  function tick(now) {
    const s = beatScale(now);
    document.querySelector(".ring-target").style.transform = `translate(-50%,-50%) scale(${s})`;
    requestAnimationFrame(tick);
  }
  const ringTarget = document.querySelector(".ring-target");
  ringTarget.style.position = "absolute";
  ringTarget.style.top = "50%";
  ringTarget.style.left = "50%";
  requestAnimationFrame(tick);

  el.tapBtn.addEventListener("click", () => {
    const now = performance.now();
    const s = beatScale(now);
    const diff = Math.abs(s - 1);
    state.reps += 1;

    let grade, xp, color;
    if (diff < 0.12) { grade = "PARFAIT !"; xp = 30; color = "var(--good)"; state.combo += 1; }
    else if (diff < 0.32) { grade = "Bien"; xp = 15; color = "var(--mid)"; state.combo += 1; }
    else { grade = "Raté"; xp = 5; color = "var(--bad)"; state.combo = 0; }

    state.bestCombo = Math.max(state.bestCombo, state.combo);
    floatText(grade + "  +" + xp + " XP", color);
    gainXp(xp);
  });

  el.resetBtn.addEventListener("click", () => {
    if (!confirm("Réinitialiser toute la progression ?")) return;
    state = { level: 1, xp: 0, reps: 0, bestCombo: 0, combo: 0 };
    save();
    render(false);
  });

  render(false);
})();
</script>
</body>
</html>
